${S.seller.name?'':`<div class="note">مشخصات فروشنده ثبت نشده است و روی فاکتور چاپی خالی می‌ماند. <button class="lk" id="gset">ثبت مشخصات</button></div>`}
<section class="card"><h3>خریدار</h3>

<details><summary>مشخصات کامل خریدار (شناسه ملی، شماره اقتصادی، نشانی…)</summary><div class="g">${SEL('f','buyer.type','نوع خریدار',['حقیقی','حقوقی','مصرف‌کننده نهایی','غیرایرانی'],b.type)}${party('f','buyer',b,'name')}</div></details></section>

<label class="f"><span>نرخ مالیات همه ردیف‌ها (٪)</span><input id="alltax" inputmode="decimal" value="${fa(v.items[0]?.tax??S.tax)}"></label>${SEL('f','pay','روش پرداخت',['نقدی','نسیه','نقدی و نسیه','چک','کارتخوان / آنلاین'],v.pay)}</div></details></section>

cur.items=cur.items.filter(i=>(i.desc||'').trim()||num(i.price));const k=INV.findIndex(x=>x.id==cur.id);cur.seller={...cur.seller};

try{localStorage.removeItem('fx_d')}catch(e){}persist(true);return true}
const E=$('#v-edit');
E.addEventListener('input',e=>{const t=e.target;if(!cur)return;if(t.dataset.f)setp(cur,t.dataset.f,t.value);else if(t.dataset.k)cur.items[t.dataset.i][t.dataset.k]=t.value;else if(t.id=='alltax'){cur.items.forEach(i=>i.tax=t.value);renderItems()}else return;upd();draft()});
E.addEventListener('change',e=>{const t=e.target,f=t.dataset.f||'';
if(f=='buyer.name'){const c=CUS.find(x=>x.name==t.value);if(c&&!cur.buyer.nid){cur.buyer={type:'حقیقی',...c};renderEdit();draft()}}
if(f.endsWith('nid')){const v=en(t.value);t.classList.toggle('bad',v.length==10&&!okMelli(v));if(t.classList.contains('bad'))toast('کد ملی معتبر نیست. ارقام را دوباره بررسی کنید.')}
if(f.endsWith('post')){t.classList.toggle('bad',!!t.value&&en(t.value).length!=10);if(t.classList.contains('bad'))toast('کد پستی باید ۱۰ رقم باشد.')}});
E.addEventListener('click',async e=>{const t=e.target.closest('button')||e.target;

<div class="row"><button class="btn" data-a="view" data-id="${v.id}">${ic('eye')}مشاهده و چاپ</button><button class="btn gh" data-a="edit" data-id="${v.id}">${ic('edit')}ویرایش</button>

$('#v-list').innerHTML=`${S.seller.name?'':`<div class="note">برای چاپ فاکتور رسمی، اول مشخصات فروشنده را ثبت کنید. <button class="lk" data-a="gset">ثبت مشخصات</button></div>`}
${INV.length?`<div class="card row sp"><div><div class="m">جمع فروش (${S.unit})</div><b class="amt">${money(sales)}</b></div><div><div class="m">مانده مطالبات</div><b class="amt">${money(due)}</b></div></div><label class="f"><span>جستجو</span><input id="q" type="search" value="${esc(q)}" placeholder="شماره، نام خریدار یا موضوع"></label>`:''}
<div id="lst">${L.length?L.map(row).join(''):INV.length?'<div class="card m">فاکتوری با این عبارت پیدا نشد. شماره، نام خریدار یا موضوع دیگری را امتحان کنید.</div>':'<div class="card"><h3>هنوز فاکتوری نساخته‌اید</h3><p class="m">اولین فاکتور را بسازید تا اینجا نمایش داده شود.</p><button class="btn" data-a="new">'+ic('plus')+'ساخت فاکتور جدید</button></div>'}</div>`;

$('#v-list').addEventListener('input',e=>{if(e.target.id=='q')renderList()});

<details class="card"><summary>مالیات و شماره‌گذاری</summary><div class="g">${F('s','tax','نرخ پیش‌فرض مالیات بر ارزش افزوده (٪)',fa(S.tax),'inputmode="decimal"')}${SEL('s','unit','واحد پول',['ریال','تومان'],S.unit)}${F('s','prefix','پیشوند شماره فاکتور',S.prefix)}${F('s','nextNo','شماره فاکتور بعدی',fa(S.nextNo),'inputmode="numeric"')}</div>

const V=$('#v-set');

V.addEventListener('change',e=>{const t=e.target,k=t.dataset.s||'';if(k.endsWith('nid')){t.classList.toggle('bad',en(t.value).length==10&&!okMelli(en(t.value)));if(t.classList.contains('bad'))toast('کد ملی معتبر نیست. ارقام را دوباره بررسی کنید.')}

return `<div class="sh"><div class="sh-h"><div>${S.logo?`<img src="${S.logo}" alt="">`:''}</div><div><h2>${v.kind}</h2><small>${v.kind=='پیش‌فاکتور'?'این سند فاقد اعتبار مالیاتی است':'صورتحساب فروش کالا و خدمات'}</small></div><div>شماره: <b>${fa(esc(v.no))}</b><br>تاریخ: <b>${fa(esc(v.date))}</b>${v.uid?`<br>شناسه یکتا: ${fa(esc(v.uid))}`:''}${v.ref?`<br>ارجاع: ${fa(esc(v.ref))}`:''}</div></div>
<div class="pt">${pb('مشخصات فروشنده',s)}${pb('مشخصات خریدار ('+(b.type||'حقیقی')+')',b)}</div><div style="margin-bottom:6px">${v.subj?'موضوع: '+esc(v.subj)+' &nbsp;|&nbsp; ':''}روش پرداخت: ${esc(v.pay)}</div>
<table><tr><th>ردیف</th><th>کد کالا</th><th>شرح کالا یا خدمات</th><th>واحد</th><th>تعداد</th><th>مبلغ واحد</th><th>مبلغ کل</th><th>تخفیف</th><th>پس از تخفیف</th><th>نرخ مالیات</th><th>مبلغ مالیات</th><th>جمع کل</th></tr>${rows}</table>
<table class="sum"><tr><td>جمع مبلغ پس از تخفیف</td><td>${money(c.net)}</td></tr><tr><td>جمع مالیات بر ارزش افزوده</td><td>${money(c.t)}</td></tr>${c.ex?`<tr><td>سایر هزینه‌ها</td><td>${money(c.ex)}</td></tr>`:''}<tr class="gt"><td>مبلغ قابل پرداخت (${u})</td><td>${money(c.total)}</td></tr>${c.paid?`<tr><td>پرداخت‌شده</td><td>${money(c.paid)}</td></tr><tr><td>مانده</td><td>${money(c.rem)}</td></tr>`:''}</table>
<p>مبلغ به حروف: <b>${words(c.total)} ${u}</b></p>${v.notes?`<p>توضیحات: ${esc(v.notes).replace(/\n/g,'<br>')}</p>`:''}<div class="sg"><div>مهر و امضای فروشنده</div><div>مهر و امضای خریدار</div></div></div>`}
function openPv(v){pv=v;$('#pvc').innerHTML=sheet(v);$('#pvc').firstChild.style.zoom=Math.min(1,(innerWidth-16)/794);$('#pv').classList.add('on');document.body.style.overflow='hidden';$('#pc').focus()}
function closePv(){$('#pv').classList.remove('on');document.body.style.overflow='';show('list')}
$('#pc').onclick=closePv;$('#pp').onclick=()=>print();$('#pe').onclick=()=>{cur=clone(pv);$('#pv').classList.remove('on');document.body.style.overflow='';show('edit')};
$('#ps').onclick=()=>{const c=calc(pv),t=`${pv.kind} شماره ${fa(pv.no)}\nتاریخ: ${fa(pv.date)}\nخریدار: ${pv.buyer.name||''}\nمبلغ قابل پرداخت: ${money(c.total)} ${pv.cur}`;navigator.share?navigator.share({title:pv.kind,text:t}).catch(()=>{}):navigator.clipboard?.writeText(t).then(()=>toast('متن خلاصه کپی شد.'))};
addEventListener('keydown',e=>{if(e.key=='Escape'&&$('#pv').classList.contains('on')&&!$('#dlg').open)closePv()});
/* راه‌اندازی */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>b.dataset.v=='new'?newInvoice():show(b.dataset.v));
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').hidden=false});$('#inst').onclick=()=>{dp?.prompt();$('#inst').hidden=true};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
applyTheme();show('list');if(location.hash=='#new')newInvoice();
</script>
</body>
